<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kendal Elektrik - Sitemizi Yeniliyoruz</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #060302;
    --text: #f6f3f0;
    --text-dim: #9a938d;
    --text-dimmer: #635d59;
    --red: #ff3b3b;
    --red-soft: #ed1c24;
    --red-deep: #7a0009;
    --hairline: rgba(255,255,255,0.09);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 32px 24px;
    overflow: hidden;
    position: relative;
    isolation: isolate;
  }

  /* layered ambient light — static gradients + one slow breathing layer, transform/opacity only */
  .field {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(1100px 700px at 50% -10%, rgba(237,28,36,0.16), transparent 60%),
      radial-gradient(900px 600px at 85% 110%, rgba(122,0,9,0.14), transparent 55%),
      radial-gradient(700px 500px at 5% 105%, rgba(255,59,59,0.08), transparent 55%);
  }

  .glow {
    position: fixed;
    top: 42%;
    left: 50%;
    width: min(720px, 130vw);
    height: min(720px, 130vw);
    transform: translate(-50%, -50%) scale(1);
    background: radial-gradient(circle, rgba(237,28,36,0.20) 0%, rgba(122,0,9,0.08) 38%, rgba(6,3,2,0) 68%);
    z-index: -1;
    animation: breathe 8s ease-in-out infinite;
    will-change: transform, opacity;
  }

  /* faint grid texture for depth, no image asset */
  .grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    opacity: 0.35;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(circle at 50% 35%, black 0%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at 50% 35%, black 0%, transparent 72%);
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
  }

  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 640px;
    width: 100%;
  }

  .emblem {
    position: relative;
    width: clamp(220px, 46vw, 300px);
    margin-bottom: clamp(32px, 7vw, 48px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .emblem::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 180%;
    height: 280%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(237,28,36,0.22) 0%, rgba(237,28,36,0.06) 45%, transparent 72%);
    filter: blur(4px);
    z-index: 0;
    animation: pulse-glow 5s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }

  .emblem svg {
    position: relative;
    z-index: 1;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 8px 28px rgba(237,28,36,0.4));
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--red);
    margin: 0 0 14px;
  }

  h1 {
    font-size: clamp(28px, 5.4vw, 44px);
    line-height: 1.18;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 18px;
  }

  h1 .accent {
    background: linear-gradient(100deg, var(--red-soft) 10%, var(--red) 50%, #ff8a5b 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.msg {
    font-size: clamp(15px, 2.4vw, 17px);
    line-height: 1.7;
    color: var(--text-dim);
    margin: 0 0 clamp(32px, 6vw, 44px);
    max-width: 480px;
  }

  .loader {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: clamp(36px, 7vw, 52px);
  }

  .loader span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red);
    animation: dot 1.4s ease-in-out infinite;
  }

  .loader span:nth-child(2) { animation-delay: 0.18s; }
  .loader span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes dot {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.75); }
    40% { opacity: 1; transform: scale(1); }
  }

  .divider {
    width: 100%;
    max-width: 300px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--hairline) 50%, transparent);
    margin-bottom: 22px;
  }

  .brands {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--text-dimmer);
    margin-bottom: 6px;
  }

  .brands b {
    color: var(--text-dim);
    font-weight: 600;
  }

  .brands .sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--text-dimmer);
  }

  footer {
    position: relative;
    z-index: 1;
    color: var(--text-dimmer);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    margin-top: clamp(28px, 6vw, 44px);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, .loader span, .emblem::before {
      animation: none !important;
    }
  }
</style>
</head>
